<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Searcher</title>
    <link id="dynamic-favicon" rel="icon" href="" />
    <meta name="google" content="notranslate" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap");

      :root {
        color-scheme: light dark;
        --light-bg: #eef2f6;
        --light-color: #112233;
        --light-panel: #ffffff;
        --light-border: #11223333;
        --dark-bg: #112233;
        --dark-color: #e8eef4;
        --dark-panel: #16283d;
        --dark-border: #ffffff33;
        --accent: light-dark(#2a4a72, #4a7fb5);
        --accent-hover: light-dark(#1f3755, #5a92c9);
        --header-bg: #0d1b2a;
      }

      * { box-sizing: border-box; }

      body {
        background-color: light-dark(var(--light-bg), var(--dark-bg));
        color: light-dark(var(--light-color), var(--dark-color));
        font-family: "Asap", sans-serif;
        margin: 0;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
      }

      .app-header {
        background: var(--header-bg);
        color: #ffffff;
        padding: 14px 20px;
      }

      .app-header-inner {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .app-header h1 {
        font-size: 1.4rem;
        margin: 0;
        font-weight: 600;
      }

      .header-icon {
        font-size: 1.6rem;
        line-height: 1;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }

      select, input, textarea, button {
        font-family: "Asap", sans-serif;
        padding: 8px;
        background: light-dark(var(--light-panel), var(--dark-panel));
        border: 1px solid light-dark(var(--light-border), var(--dark-border));
        color: inherit;
        border-radius: 4px;
      }

      select, input, textarea {
        width: 100%;
      }

      select {
        font-size: 1rem;
        margin-bottom: 12px;
        cursor: pointer;
      }

      select option {
        background: light-dark(var(--light-panel), #112233);
        color: light-dark(#112233, #ffffff);
      }

      .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .search-row input {
        flex: 1;
        margin-bottom: 0;
        font-size: 2rem;
        padding: 5px;
      }

      .search-row button {
        font-size: 1.2rem;
        padding: 5px 24px;
        cursor: pointer;
        font-weight: 500;
        background: var(--accent);
        border-color: transparent;
        color: #ffffff;
      }

      .search-row button:hover {
        background: var(--accent-hover);
      }

      .search-row button:active {
        opacity: 0.85;
      }

      textarea {
        height: 160px;
        margin-bottom: 5px;
        resize: vertical;
        font-size: 1rem;
        padding: 5px;
      }

      .sites-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      @media (max-width: 500px) {
        .search-row { flex-direction: column; }
        .search-row button { width: 100%; }
      }

      @media (max-width: 480px) {
        .app-header { padding: 10px 16px; }
        .app-header h1 { font-size: 1.15rem; }
        .header-icon { font-size: 1.3rem; }
        .container { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <span class="header-icon" aria-hidden="true">🔍</span>
        <h1>Multi Searcher</h1>
      </div>
    </header>

    <main class="container">
    <label for="searchEngine">Search Engine</label>
    <select id="searchEngine">
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="bing">Bing</option>
      <option value="brave">Brave Search</option>
      <option value="perplexity">Perplexity</option>
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
      <option value="yandex">Yandex</option>
    </select>

    <label for="searchQuery">Search Query</label>
    <div class="search-row">
      <input type="text" id="searchQuery" list="historyList" placeholder="Search Query" />
      <datalist id="historyList"></datalist>
      <button id="searchBtn">Search</button>
    </div>

    <label for="sitesTextarea">Sites (one per line)</label>
    <textarea id="sitesTextarea"></textarea>
    <div class="sites-actions">
      <button id="resetBtn" type="button">Restore Defaults</button>
    </div>
    </main>

    <script>
      const ENGINES = {
        google:     (s, q) => { const p = new URLSearchParams(); p.set('q', `"${s}" ${q}`); return `https://www.google.com/search?${p}`; },
        duckduckgo: (s, q) => { const p = new URLSearchParams(); p.set('q', `"${s}" ${q}`); return `https://duckduckgo.com/?${p}`; },
        bing:       (s, q) => { const p = new URLSearchParams(); p.set('q', `"${s}" ${q}`); return `https://www.bing.com/search?${p}`; },
        brave:      (s, q) => { const p = new URLSearchParams(); p.set('q', `${s} ${q}`); return `https://search.brave.com/search?${p}`; },
        perplexity: (s, q) => { const p = new URLSearchParams(); p.set('q', `${s} ${q}`); return `https://www.perplexity.ai/search?${p}`; },
        chatgpt:    (s, q) => { const p = new URLSearchParams(); p.set('q', `${q} on ${s}`); p.set('hints', 'search'); return `https://chatgpt.com/?${p}`; },
        claude:     (s, q) => { const p = new URLSearchParams(); p.set('q', `Find information about ${q} on ${s}`); return `https://claude.ai/new?${p}`; },
        gemini:     () => 'https://gemini.google.com/',
        yandex:     (s, q) => { const p = new URLSearchParams(); p.set('text', `${s} ${q}`); return `https://yandex.com/search/?${p}`; },
      };

      const DEFAULT_SITES = 'hdfilmcehennemi\nyoutube\nakakçe\ncimri\nepey\n';

      const SITES_KEY = 'multisearcher';
      const ENGINE_KEY = 'selectedEngine';
      const HISTORY_KEY = 'multisearcherHistory';
      const MAX_HISTORY = 10;

      const engineSelect = document.getElementById('searchEngine');
      const queryInput = document.getElementById('searchQuery');
      const searchBtn = document.getElementById('searchBtn');
      const sitesTextarea = document.getElementById('sitesTextarea');
      const historyList = document.getElementById('historyList');
      const resetBtn = document.getElementById('resetBtn');

      const getHistory = () => {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
        catch { return []; }
      };

      const renderHistory = () => {
        historyList.innerHTML = '';
        for (const h of getHistory()) {
          const opt = document.createElement('option');
          opt.value = h;
          historyList.appendChild(opt);
        }
      };

      const addToHistory = (q) => {
        let h = getHistory().filter(x => x !== q);
        h.unshift(q);
        if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        renderHistory();
      };

      const performSearch = () => {
        const q = queryInput.value.trim();
        if (!q) return;

        const engine = engineSelect.value;
        const sites = sitesTextarea.value.split('\n').filter(s => s.trim());

        if (engine === 'gemini') {
          alert('Gemini does not support URL query parameters.\nThe Gemini homepage will be opened.\nUse @gemini in Chrome address bar as a workaround.');
          window.open('https://gemini.google.com/');
        } else {
          for (const site of sites) {
            const url = ENGINES[engine](site.trim(), q);
            window.open(url);
          }
        }

        addToHistory(q);
      };

      queryInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
      });

      searchBtn.addEventListener('click', performSearch);

      engineSelect.addEventListener('change', () => {
        localStorage.setItem(ENGINE_KEY, engineSelect.value);
      });

      sitesTextarea.addEventListener('input', () => {
        localStorage.setItem(SITES_KEY, sitesTextarea.value);
      });

      resetBtn.addEventListener('click', () => {
        if (confirm('Restore the default sites? This will replace the current list.')) {
          sitesTextarea.value = DEFAULT_SITES;
          localStorage.removeItem(SITES_KEY);
          sitesTextarea.focus();
        }
      });

      const setEmojiFavicon = (emoji = "🔍") => {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 64, 64);
        ctx.font = "56px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, 32, 36);
        const favicon = document.getElementById("dynamic-favicon");
        favicon.href = canvas.toDataURL("image/png");
      }

      window.addEventListener('load', () => {
        const saved = localStorage.getItem(ENGINE_KEY);
        if (saved && ENGINES[saved]) engineSelect.value = saved;

        sitesTextarea.value = localStorage.getItem(SITES_KEY) || DEFAULT_SITES;

        renderHistory();
        queryInput.focus();
        queryInput.select();

        setEmojiFavicon("🔍");
      });
    </script>
  </body>
</html>
